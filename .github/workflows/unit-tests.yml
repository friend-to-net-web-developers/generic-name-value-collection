name: Unit Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore FriendToNetWebDevelopers.GenericNameValueCollection.Tests/FriendToNetWebDevelopers.GenericNameValueCollection.Tests.csproj

    - name: Build
      run: dotnet build FriendToNetWebDevelopers.GenericNameValueCollection.Tests/FriendToNetWebDevelopers.GenericNameValueCollection.Tests.csproj --no-restore -c Debug

    - name: Test
      run: dotnet test FriendToNetWebDevelopers.GenericNameValueCollection.Tests/FriendToNetWebDevelopers.GenericNameValueCollection.Tests.csproj --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET Test Results
        path: "**/test-results.trx"
        reporter: dotnet-trx

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/test-results.trx"
